name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check when called by the release workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    name: Tests (Rust ${{ matrix.toolchain }})
    env:
      # Avoid forked signal-test children briefly retaining another test's flock.
      RUST_TEST_THREADS: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.86.0", stable]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config tzdata
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Unit tests and documentation examples
        run: cargo test --workspace --locked
      - name: Schedule regressions across time zones
        if: matrix.toolchain == 'stable'
        run: |
          for zone in America/New_York Europe/Berlin Pacific/Apia Pacific/Kiritimati; do
            echo "Testing schedules in $zone"
            TZ="$zone" cargo test -p backlightd --bin backlightd --locked auto::tests -- --test-threads=1
          done

  documentation:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - run: cargo doc --workspace --no-deps --locked

  build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - run: cargo build --workspace --release --locked
      - name: Check staged installation and package templates
        run: packaging/test.sh
